<div class="mood-section">
    <label for="moodSelect">Select your current Wizarding Mindset</label>
    <select id="moodSelect" class="magic-select" onchange="summonSong()">
        <option value="" disabled selected>— Choose an Aura —</option>
        <option value="studying">Studying in the Ravenclaw Tower (Focus)</option>
        <option value="melancholy">Rainy Day in the Forbidden Forest (Moody)</option>
        <option value="mysterious">Sneaking into the Restricted Section (Intense)</option>
        <option value="cozy">Warm Butterbeer by the Common Room Fire (Chill)</option>
    </select>
</div>

<div class="player-container" id="playerContainer">
    <div class="player-title" id="spellCast"></div>
    <iframe id="musicFrame" width="100%" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>
