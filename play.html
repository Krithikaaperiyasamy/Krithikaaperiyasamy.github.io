<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 36px;
        }

        .score {
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 3px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card.flipped {
            background: white;
            color: #667eea;
        }

        .card.matched {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Memory Game</h1>
        <div class="score">Matches: <span id="matches">0</span>/8</div>
        <div class="game-board" id="gameBoard"></div>
        <button onclick="resetGame()">Reset Game</button>
        <a href="index.html" class="back-link">← Back Home</a>
    </div>

    <script>
        const emojis = ['🎨', '🎮', '🎭', '🎪', '🎨', '🎮', '🎭', '🎪',
                       '🎯', '🎲', '🎸', '🎺', '🎯', '🎲', '🎸', '🎺'];
        let cards = [];
        let flipped = [];
        let matched = 0;

        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            cards = emojis.sort(() => 0.5 - Math.random());
            flipped = [];
            matched = 0;

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = '?';
                card.onclick = () => flipCard(index, card);
                gameBoard.appendChild(card);
            });
        }

        function flipCard(index, element) {
            if (flipped.length >= 2 || flipped.includes(index)) return;

            flipped.push(index);
            element.classList.add('flipped');
            element.textContent = cards[index];

            if (flipped.length === 2) {
                setTimeout(checkMatch, 500);
            }
        }

        function checkMatch() {
            const [first, second] = flipped;
            const gameBoard = document.getElementById('gameBoard');
            const cards_elements = gameBoard.children;

            if (cards[first] === cards[second]) {
                cards_elements[first].classList.add('matched');
                cards_elements[second].classList.add('matched');
                matched++;
                document.getElementById('matches').textContent = matched;
            } else {
                cards_elements[first].classList.remove('flipped');
                cards_elements[second].classList.remove('flipped');
                cards_elements[first].textContent = '?';
                cards_elements[second].textContent = '?';
            }

            flipped = [];

            if (matched === 8) {
                setTimeout(() => alert('🎉 You won! Great job!'), 300);
            }
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
