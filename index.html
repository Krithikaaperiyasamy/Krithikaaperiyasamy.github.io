<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ebde87 0%, #E0F6FF 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Teddy bear peeking out from the right */
        body::before {
            content: '';
            position: fixed;
            bottom: -50px;
            right: -100px;
            width: 400px;
            height: 450px;
            background: radial-gradient(circle at 30% 30%, #8B6F47 0%, #6B5436 50%, #4A3D2A 100%);
            border-radius: 50%;
            z-index: 1;
        }

        /* Head */
        body::after {
            content: '';
            position: fixed;
            bottom: 80px;
            right: -40px;
            width: 280px;
            height: 300px;
            background: #8B6F47;
            border-radius: 50%;
            z-index: 2;
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.3);
        }

        p {
            position: relative;
            z-index: 10;
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-weight: 900;
            font-size: 36px;
            display: inline-block;
            margin-left: 6px;
            color: #111;
        }

        /* Left ear */
        .ear-left {
            position: fixed;
            bottom: 320px;
            right: 140px;
            width: 70px;
            height: 80px;
            background: #8B6F47;
            border-radius: 50% 50% 40% 40%;
            z-index: 3;
            transform: rotate(-25deg);
        }

        /* Right ear */
        .ear-right {
            position: fixed;
            bottom: 320px;
            right: 20px;
            width: 70px;
            height: 80px;
            background: #8B6F47;
            border-radius: 50% 50% 40% 40%;
            z-index: 3;
            transform: rotate(25deg);
        }

        /* Left eye */
        .eye-left {
            position: fixed;
            bottom: 240px;
            right: 120px;
            width: 25px;
            height: 30px;
            background: #000;
            border-radius: 50%;
            z-index: 5;
        }

        /* Right eye */
        .eye-right {
            position: fixed;
            bottom: 240px;
            right: 60px;
            width: 25px;
            height: 30px;
            background: #000;
            border-radius: 50%;
            z-index: 5;
        }

        /* Nose */
        .nose {
            position: fixed;
            bottom: 180px;
            right: 85px;
            width: 20px;
            height: 20px;
            background: #3D2817;
            border-radius: 50%;
            z-index: 5;
        }

        /* Mouth */
        .mouth {
            position: fixed;
            bottom: 160px;
            right: 75px;
            width: 40px;
            height: 3px;
            background: #3D2817;
            border-radius: 50%;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="ear-left"></div>
    <div class="ear-right"></div>
    <div class="eye-left"></div>
    <div class="eye-right"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
    <p><i>Hi</i> I am <span class="name">krithikaa</span></p>
    <p style="position: relative; z-index: 10; margin-top: 30px;"><a href="play.html" style="color: #667eea; text-decoration: none; font-weight: bold; font-size: 18px; padding: 10px 20px; background: white; border-radius: 5px; display: inline-block; transition: all 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">🎮 Play Memory Game</a></p>
</body>
</html>
