<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Letters Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            position: relative;
            width: 600px;
            height: 700px;
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ff00;
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
        }

        .score, .lives {
            display: flex;
            gap: 10px;
        }

        .game-area {
            width: 100%;
            height: calc(100% - 60px);
            position: relative;
            background: linear-gradient(to bottom, rgba(50, 50, 50, 0.3), rgba(0, 0, 0, 0.5));
        }

        .falling-letter {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00ff00, #00cc00);
            border: 2px solid #00ff00;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: black;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: glow 0.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 20px rgba(0, 255, 0, 1), inset 0 0 10px rgba(255, 255, 255, 0.5);
            }
        }

        .falling-letter.missed {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .falling-letter.hit {
            animation: hitAnimation 0.3s ease-out;
        }

        @keyframes hitAnimation {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
            border-radius: 10px;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-title {
            font-size: 48px;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        }

        .final-score {
            font-size: 32px;
            color: #00ff00;
            font-weight: bold;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #00ff00, #00cc00);
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .info-text {
            color: #00ff00;
            font-size: 16px;
            text-align: center;
            padding: 10px;
        }

        .difficulty {
            color: #00ff00;
            font-size: 14px;
        }

        .hit-effect {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            pointer-events: none;
            animation: floatUp 0.8s ease-out;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="difficulty">Difficulty: <span id="difficulty">Easy</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
        </div>
        <div class="game-area" id="gameArea"></div>
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-title">GAME OVER</div>
            <div class="final-score">Final Score: <span id="finalScore">0</span></div>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const difficultyDisplay = document.getElementById('difficulty');

        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let gameTime = 0;
        let letterSpeed = 2;
        let spawnRate = 80;

        const gameState = {
            activeLetters: []
        };

        function getRandomLetter() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            return letters[Math.floor(Math.random() * letters.length)];
        }

        function updateDifficulty() {
            // Gradual speed increase: starts at 2, increases by 0.01 per frame
            letterSpeed = 2 + (gameTime * 0.01);
            
            // Spawn rate decreases (letters spawn more frequently): starts at 80, decreases over time
            spawnRate = Math.max(30, 80 - (gameTime * 0.3));
            
            // Update difficulty label
            if (gameTime > 120) {
                difficultyDisplay.textContent = 'Insane';
            } else if (gameTime > 60) {
                difficultyDisplay.textContent = 'Hard';
            } else if (gameTime > 30) {
                difficultyDisplay.textContent = 'Medium';
            } else {
                difficultyDisplay.textContent = 'Easy';
            }
        }

        function spawnLetter() {
            if (!gameRunning) return;

            const letter = getRandomLetter();
            const div = document.createElement('div');
            div.className = 'falling-letter';
            div.textContent = letter;
            div.style.left = Math.random() * (gameArea.clientWidth - 50) + 'px';
            div.style.top = '-50px';

            const letterObj = {
                element: div,
                letter: letter,
                x: parseInt(div.style.left),
                y: -50,
                matched: false
            };

            gameState.activeLetters.push(letterObj);
            gameArea.appendChild(div);
        }

        function updateLetters() {
            gameState.activeLetters.forEach((letterObj, index) => {
                if (!letterObj.matched) {
                    letterObj.y += letterSpeed;
                    letterObj.element.style.top = letterObj.y + 'px';

                    // Check if letter passed the bottom
                    if (letterObj.y > gameArea.clientHeight) {
                        if (!letterObj.matched) {
                            lives--;
                            livesDisplay.textContent = lives;
                            letterObj.element.classList.add('missed');

                            if (lives <= 0) {
                                endGame();
                            }
                        }
                        letterObj.element.remove();
                        gameState.activeLetters.splice(index, 1);
                    }
                }
            });
        }

        function matchLetter(key) {
            if (!gameRunning) return;

            key = key.toUpperCase();

            for (let i = gameState.activeLetters.length - 1; i >= 0; i--) {
                const letterObj = gameState.activeLetters[i];
                if (letterObj.letter === key && !letterObj.matched) {
                    letterObj.matched = true;
                    letterObj.element.classList.add('hit');

                    // Create hit effect
                    const hitEffect = document.createElement('div');
                    hitEffect.className = 'hit-effect';
                    hitEffect.textContent = '+10';
                    hitEffect.style.left = letterObj.x + 'px';
                    hitEffect.style.top = letterObj.y + 'px';
                    gameArea.appendChild(hitEffect);

                    setTimeout(() => {
                        letterObj.element.remove();
                        hitEffect.remove();
                        gameState.activeLetters.splice(i, 1);
                    }, 300);

                    score += 10;
                    scoreDisplay.textContent = score;
                    return; // Match only one letter per key press
                }
            }
        }

        function endGame() {
            gameRunning = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('show');
        }

        function restartGame() {
            score = 0;
            lives = 3;
            gameRunning = true;
            gameTime = 0;
            letterSpeed = 2;
            spawnRate = 80;
            gameState.activeLetters = [];

            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            difficultyDisplay.textContent = 'Easy';
            gameOverScreen.classList.remove('show');

            gameArea.innerHTML = '';

            gameLoop();
        }

        function gameLoop() {
            if (!gameRunning) return;

            gameTime += 1;
            updateDifficulty();

            if (gameTime % spawnRate === 0) {
                spawnLetter();
            }

            updateLetters();

            requestAnimationFrame(gameLoop);
        }

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            matchLetter(e.key);
        });

        // Start the game
        gameLoop();
    </script>
</body>
</html>
