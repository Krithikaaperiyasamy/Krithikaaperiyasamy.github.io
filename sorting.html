<div class="sorting-hat-box">
    <h2 id="quizQuestion">🔮 The Sorting Hat Awaits...</h2>
    <p id="questionPrompt">Answer a few questions and discover the house that fits your magic.</p>

    <div id="optionsContainer" class="quiz-options"></div>
    <div id="progressText" class="quiz-progress">Question 1 of 3</div>

    <div id="resultDisplay" class="result-panel" style="display: none;">
        <div class="result-title">⚡ The Sorting Hat says...</div>
        <div class="result-house"><span id="houseName"></span>!</div>
        <div id="houseDescription" class="house-description"></div>
        <button class="magic-btn reset-btn" onclick="resetSortingQuiz()">Try Again</button>
    </div>
</div>
